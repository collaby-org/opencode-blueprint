<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="opencode-blueprint: one command, a complete opencode environment">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="0.55" stop-color="#0D1426"/>
      <stop offset="1" stop-color="#0A0E1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="0.5" stop-color="#7C5BFF"/>
      <stop offset="1" stop-color="#2EE6A8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .flow { stroke-dasharray: 10 14; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -24; } }
    .node { animation: pulse 2.8s ease-in-out infinite; }
    .node2 { animation-delay: .4s; } .node3 { animation-delay: .8s; } .node4 { animation-delay: 1.2s; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .beam { animation: beam 4.5s ease-in-out infinite; }
    @keyframes beam { 0%,100% { opacity: .25; } 50% { opacity: .7; } }
    .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.85"/>

  <text class="label" x="64" y="104" fill="#F2F5FF" font-size="58" font-weight="700" letter-spacing="-1.5">opencode-blueprint</text>
  <text class="label" x="66" y="146" fill="#9FB0D0" font-size="21">One command. A complete, opinionated, production-grade opencode environment.</text>

  <g transform="translate(66,176)">
    <rect x="0" y="0" width="214" height="46" rx="12" fill="#111A31" stroke="#2A3A63"/>
    <text class="mono" x="20" y="29" fill="#5B8CFF" font-size="16">npx opencode-blueprint</text>
    <rect x="232" y="0" width="120" height="46" rx="12" fill="#0E1A1A" stroke="#1E4A3C"/>
    <text class="mono" x="252" y="29" fill="#2EE6A8" font-size="15">MIT</text>
    <text class="label" x="380" y="29" fill="#7D8DB0" font-size="16">Restart opencode. Create any folder. Start coding.</text>
  </g>

  <g transform="translate(66,262)">
    <line class="flow" x1="16" y1="0" x2="948" y2="0" stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.85"/>
    <g>
      <circle class="node"  cx="16"  cy="0" r="7" fill="#5B8CFF" filter="url(#glow)"/>
      <circle class="node2" cx="326" cy="0" r="7" fill="#6E7BFF" filter="url(#glow)"/>
      <circle class="node3" cx="636" cy="0" r="7" fill="#7C5BFF" filter="url(#glow)"/>
      <circle class="node4" cx="948" cy="0" r="7" fill="#2EE6A8" filter="url(#glow)"/>
    </g>
    <text class="label" x="8"   y="28" fill="#8FA0C4" font-size="15">Isolate</text>
    <text class="label" x="318" y="28" fill="#8FA0C4" font-size="15">Build</text>
    <text class="label" x="628" y="28" fill="#8FA0C4" font-size="15">Prove</text>
    <text class="label" x="940" y="28" fill="#8FA0C4" font-size="15">Ship</text>
  </g>

  <g transform="translate(1040,52)">
    <rect class="beam" x="0" y="0" width="104" height="120" rx="16" fill="#0E1428" stroke="#26325C"/>
    <text class="label" x="52" y="36" text-anchor="middle" fill="#5B8CFF" font-size="28" font-weight="700">22</text>
    <text class="label" x="52" y="56" text-anchor="middle" fill="#8FA0C4" font-size="12">MCP servers</text>
    <text class="label" x="52" y="82" text-anchor="middle" fill="#7C5BFF" font-size="20" font-weight="700">11</text>
    <text class="label" x="52" y="100" text-anchor="middle" fill="#8FA0C4" font-size="12">plugins</text>
  </g>
</svg>
