title = "opencode-blueprint gitleaks configuration"

[extend]
useDefault = true

# One known finding, already public: a Kodus team key was committed to
# skills/kodus-review/SKILL.md on 2026-10-03 and is in the history. The key
# was removed from the file; the credential itself must be rotated in the
# Kodus app, because a key that was committed once is leaked.
#
# The allowlist is scoped to that single commit, that single file and that
# single rule, so every other finding still fails the scan. When the key is
# rotated, this entry is the last thing to remove.
[[allowlists]]
description = "Known leaked Kodus team key in the history; rotation pending"
paths = [
  '''skills/kodus-review/SKILL\.md''',
]
rules = ["generic-api-key"]
commits = ["3eaf4ac7a25874faf37d7c7a9fc5bca7551015bf"]
