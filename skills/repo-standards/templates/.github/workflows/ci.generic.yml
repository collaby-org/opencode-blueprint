name: CI

# Generated by repo-standards for the {{STACK}} stack.
# Every action is pinned to a commit. Required check: it must pass without any
# secret, because pull requests from forks never receive one.
#
# The four commands are TODO until you fill them. A TODO command fails the job
# on purpose: a green job that ran nothing is worse than a red one that says so.

on:
  pull_request:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSTALL_CMD: "{{INSTALL_CMD}}"
      LINT_CMD: "{{LINT_CMD}}"
      TEST_CMD: "{{TEST_CMD}}"
      BUILD_CMD: "{{BUILD_CMD}}"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install
        if: ${{ env.INSTALL_CMD != '' }}
        run: bash -e -o pipefail -c "$INSTALL_CMD"

      - name: Lint
        if: ${{ env.LINT_CMD != '' }}
        run: bash -e -o pipefail -c "$LINT_CMD"

      - name: Test
        if: ${{ env.TEST_CMD != '' }}
        run: bash -e -o pipefail -c "$TEST_CMD"

      - name: Build
        if: ${{ env.BUILD_CMD != '' }}
        run: bash -e -o pipefail -c "$BUILD_CMD"
