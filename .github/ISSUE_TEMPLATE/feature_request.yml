name: Feature request
description: Propose a capability this project does not have.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste `.env` files, tokens, keys, passwords, or customer data.
        Describe the need, not a private configuration. Security problems go
        through the private channel in `.github/SECURITY.md`, not here.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and who it affects.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behavior you want. A sketch is enough.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, including doing nothing.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, or constraints. Redact anything private.
    validations:
      required: false
