name: CI

# This repository is a configuration package, not an application: there is no
# build and no test suite. What must hold is that every script parses, that
# the repository still carries the repo standards, and that the disk hygiene
# report runs. Every action is pinned to a commit, and the job needs no
# secret, so a pull request from a fork runs it too.

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, standards, hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_VERSION: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: ${{ env.NODE_VERSION != '' }}
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Syntax check every script
        run: |
          set -euo pipefail
          for file in bin/*.mjs skills/*/scripts/*.mjs; do
            node --check "$file"
          done

      - name: Repo standards
        # The global AGENTS.md is not present on a runner, so the check
        # verifies the repository side only: the required files, their shape,
        # and the pinned action SHAs.
        run: node bin/standards.mjs --check .

      - name: Disk hygiene report
        run: node bin/clean.mjs
