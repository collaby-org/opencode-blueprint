name: Secret scan

# Required check. It runs without a secret: gitleaks is downloaded from a
# pinned release and every action is pinned to a commit.
#
# `.gitleaksignore` in the repository root carries the fingerprint of one
# known finding: a Kodus team key that was committed on 2026-10-03 and is still
# in the history. The value is out of the file; the credential has to be
# rotated in the Kodus app. Every other finding still fails this job.

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          # The sha256 of the exact asset below. A download that is not the
          # pinned build fails the job instead of scanning with whatever
          # arrived.
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history and working tree
        continue-on-error: false
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact --verbose --exit-code 1 \
            --report-format json --report-path gitleaks-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14
